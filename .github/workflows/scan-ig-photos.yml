name: Scan photos Instagram

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
    inputs:
      force_handles:
        description: 'Handles a re-traiter (separes par des virgules)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: scan-ig-photos
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer gh-pages (site + donnees + script)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer le SDK Firebase et la super-resolution IA
        run: npm install --no-save --no-audit --no-fund firebase@12.19.0 @tensorflow/tfjs@4.11.0 @upscalerjs/esrgan-medium sharp

      - name: Recuperer les photos Instagram manquantes
        env:
          TROMBI_SPACE_ID: ${{ secrets.TROMBI_SPACE_ID }}
          FORCE_HANDLES: ${{ github.event.inputs.force_handles }}
        run: node scripts/scan-ig-photos.mjs

      - name: Publier les changements
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name  "IG Photo Robot"
            git config user.email "actions@github.com"
            git add data
            git commit -m "Robot IG : photos de profil mises a jour"
            git push
          else
            echo "Aucun changement."
          fi
